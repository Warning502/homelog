# HomeLog — built from the source in this repository.
#
# First run:
#   echo "JWT_SECRET=$(openssl rand -base64 32)" > .env
#   docker compose up -d --build
#
# After pulling new code:
#   git pull && docker compose up -d --build
#
# Data (SQLite database, uploaded PDFs, avatars) lives in ./data and survives
# rebuilds and container removal.

services:
  homelog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: homelog-th:latest
    container_name: homelog
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - DB_PATH=/app/data/homelog.db
      # Required. Keep it stable in .env: changing it logs everyone out.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      - TZ=${TZ:-Asia/Bangkok}
      # Set to "true" when served over HTTPS behind a reverse proxy.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
