# Render Blueprint: the public HomeLog demo on Render's free plan.
# Setup guide (Thai): deploy/render/README.md
#
# Demo mode only. Free instances have an ephemeral disk and sleep after 15
# idle minutes; each start seeds a fresh Thai sample household, and demo mode
# also resets it every hour, so nothing here is ever real data.
services:
  - type: web
    name: homelog-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GIN_MODE
        value: release
      - key: DB_PATH
        value: /app/data/homelog.db
      - key: TZ
        value: Asia/Bangkok
      - key: COOKIE_SECURE
        value: "true"
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Optional GoatCounter site code for visit stats; empty = none.
      - key: DEMO_GOATCOUNTER_SITE
        value: ""
